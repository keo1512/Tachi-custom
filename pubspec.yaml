name: tachi_books
description: "Manga, truyện chữ và ebook với hai hệ extension."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  archive: ^4.3.0
  xml: ^7.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_widget_from_html_core: ^0.17.4
  crypto: ^3.0.7
  flutter_tts: ^4.2.5
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/notoserif.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/notosans.ttf
