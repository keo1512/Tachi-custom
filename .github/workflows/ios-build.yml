name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Positive iOS build number
        required: true
        default: '11'
        type: string
      native_smoke:
        description: Run native integration checks when UIKit or platform bridges change
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Compile iPhone and iPad app (unsigned)
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      TACHI_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Firebase iOS and Google login
        shell: bash
        env:
          TACHI_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.TACHI_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys
          import tempfile
          sys.path.insert(0, str(pathlib.Path('tools').resolve()))
          from configure_firebase_ios import configure
          encoded = os.environ.get('TACHI_GOOGLE_SERVICE_INFO_PLIST_BASE64', '')
          if not encoded:
              raise SystemExit('Missing TachiBooks Firebase iOS configuration secret. No build started.')
          try:
              payload = base64.b64decode(encoded, validate=True)
              if len(payload) > 65536:
                  raise ValueError('Configuration too large')
              with tempfile.TemporaryDirectory(prefix='tachibooks-firebase-', dir=os.environ['RUNNER_TEMP']) as temporary:
                  source = pathlib.Path(temporary) / 'GoogleService-Info.plist'
                  source.write_bytes(payload)
                  configure(source, pathlib.Path('ios').resolve())
          except Exception:
              raise SystemExit('Invalid TachiBooks Firebase iOS configuration. Config values were not printed.') from None
          print('TachiBooks Firebase and Google iOS configuration prepared.')
          PY

      - name: Install official Flutter 3.47.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/tachibooks-flutter"
          test "$(git -C "$RUNNER_TEMP/tachibooks-flutter" rev-parse HEAD)" = '9584c6713b324636289d067944a46fd6b49df14b'
          echo "$RUNNER_TEMP/tachibooks-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tachibooks-flutter/bin/flutter" --version
          "$RUNNER_TEMP/tachibooks-flutter/bin/flutter" precache --ios

      - name: Prepare verified on-device extension engine
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$(/usr/libexec/java_home -v 21)"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 tools/configure_ios_tachi_runtime.py

      - name: Test native UIKit tabs on an iOS 27 iPhone simulator
        if: ${{ inputs.native_smoke }}
        shell: bash
        timeout-minutes: 60
        run: bash tools/test_ios_native_tabs.sh

      - name: Upload native simulator test results
        if: ${{ always() && inputs.native_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TachiBooks-native-tabs-smoke-${{ github.run_number }}
          path: |
            artifacts/native-tabs-smoke.xcresult
            artifacts/native-tabs-smoke.log
            artifacts/native-tabs-compile.log
            artifacts/native-tabs-simulator.json
            artifacts/native-tabs-simulator.png
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze, test and compile unsigned IPA
        shell: bash
        run: bash tools/build_ios.sh "$TACHI_BUILD_NUMBER"

      - name: Upload unsigned IPA and build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TachiBooks-iOS-unsigned-${{ github.run_number }}
          path: |
            build/ios/ipa/TachiBooks-unsigned.ipa
            build/ios/ipa/TachiBooks-unsigned.ipa.sha256
            build/ios/ipa/TachiBooks-unsigned.build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Explain artifact installation status
        shell: bash
        run: |
          printf '%s\n' '### TachiBooks unsigned iOS package' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The artifact contains an unsigned device IPA for iPhone and iPad. It requires re-signing with valid provisioning before installation.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Native simulator smoke is an explicit workflow input for changes to UIKit navigation. Inspect its separate artifact when enabled. This workflow does not test a physical iPhone or iPad.' >> "$GITHUB_STEP_SUMMARY"
